<html>
    <head>
        <title>Calculator</title>
        <style>
            h1{
                text-align: center;
                background-color: aqua;
            }
            .parent{
                padding: 10px;
                background-color: red;
                gap: 3px;
                width: 100%;
                height: 100px;
                display: grid;
                grid-template-columns: auto auto auto auto auto;
            }
            div{
                background-color: azure;
                line-height: -10px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Calculator</h1>
        <h2>CSS GRID</h2>
        <div class="parent">
            <div>1</div>
            <div>1</div>
            <div>1</div>
            <div>1</div>
            <div>1</div>
        </div>
    </body>
</html>
