<html>
    <head>
        <title>Functions_Using_JS</title>
    </head>
    <body>
        <h1>Functions_Using_JS</h1>
        <script>
            //1. normal functions
            function sum()
            {
                return "Bhuvan:"+"<br>";
            };
            document.write(sum());
            //2. Parameter/Argument Functions
            function sum1(a,b)
            {
                return a+b+"<br>";
            }
            document.write(sum1(100,200))
            //3. Parameter with value Function
            function sum2(a=100,b=200)
            {
                return a+b+"<br>";
            }
            document.write(sum2())
            //arrow function
            let sum3=()=>{
                return "Bhuvan"+"<br>"
            };
            document.write(sum3());
            let sum4=(a,b)=>{
                return a+b+"<br>"
            };
            document.write(sum4(100,200));
            let sum5=(a=100,b=200)=>{
                return a+b+"<br>"
            };
            document.write(sum5());
        </script>
    </body>
</html>
