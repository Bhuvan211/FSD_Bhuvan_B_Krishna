<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
            let a=100;
            let b= 200
            let add=(x=a,y=b)=>{
                return a+b+"<br>";
            };
            document.write(`Sum of A = ${a} + B = ${b}: `+ add());
            let sub=(x=a,y=b)=>{
                return a-b+"<br>";
            };
            document.write(`Sub of A = ${a} - B = ${b}: `+ sub());
            let mul=(x=a,y=b)=>{
                return a*b+"<br>";
            };
            document.write(`Multiple of A = ${a} + B = ${b}: `+ mul());
            let div=(x=a,y=b)=>{
                return a/b+"<br>";
            };
            document.write(`Div of A = ${a} + B = ${b}: `+ div());
            let mod=(x=a,y=b)=>{
                return a%b+"<br>";
            };
            document.write(`Modulus of A = ${a} + B = ${b}: `+ mod());
        </script>
    </body>
</html>
