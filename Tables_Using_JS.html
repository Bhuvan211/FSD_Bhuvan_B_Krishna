<html>
    <head>
        <title>Tables_Using_JS</title>
    </head>
    <body>
        <h1>Tables_Using_JS</h1>
        <script>
            for(let a = 1; a<=10 ;a++){
                document.write(`5 X ${a} = ${5*a}<br>`);
            }
            let b = 1;
            while(b<=10){
                document.write(`10 X ${b} = ${10*b}<br>`);
                b++;
            }
            let c = 1;
            do{
                document.write(`15 X ${c} = ${15*c}<br>`);
                c++
            }while(c<=10)
        </script>
    </body>
</html>
