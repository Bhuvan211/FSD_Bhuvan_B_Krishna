<html>
    <head>
        <title>Tables_Using_JS</title>
    </head>
    <body>
        <h1>Tables_Using_JS</h1>
        <script>
            let mul = Number(prompt("Enter Your Number:  "));
            let a = 1
            while(a<= 10){
                document.write(`${mul} X ${a} = ${mul * a}<br>`);
                a++;
            }
        </script>
    </body>
</html>
